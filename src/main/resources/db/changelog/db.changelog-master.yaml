databaseChangeLog:
  - changeSet:
      id: create-table-users
      author: alex_mitty
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: login
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: role
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

  - changeSet:
      id: insert-initial-data
      author: alex_mitty
      changes:
        - insert:
            tableName: users
            columns:
              - column:
                  name: login
                  value: user
              - column:
                  name: password
                  value: user
              - column:
                  name: role
                  value: USER
        - insert:
            tableName: users
            columns:
              - column:
                  name: login
                  value: admin
              - column:
                  name: password
                  value: admin
              - column:
                  name: role
                  value: ADMIN